<div id="panel-wysylania">
    <h3>Dodaj nowy film na Swappy 🚀</h3>
    
    <p>Wybierz wideo z telefonu:</p>
    <input type="file" id="wideo-plik" accept="video/*">
    
    <p>Dodaj opis (np. #streetwear):</p>
    <input type="text" id="wideo-opis" placeholder="Napisz coś...">
    
    <button id="przycisk-wyslij">Wyślij film na Swappy</button>
    <p id="status-wysylki"></p>
</div>

<h2>Najnowsze filmy na Swappy 👇</h2>
<div id="swappy-feed"></div>
