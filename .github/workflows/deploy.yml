name: Build and Deploy Swappy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          VITE_BASE_PATH: /Swappy-/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

### Krok 4 — zapisz plik
1. Kliknij **Commit changes**.
2. Jeśli pojawi się ponownie przycisk **Commit changes**, kliknij go jeszcze raz, aby zatwierdzić zapis.

GitHub powinien wtedy rozpocząć budowanie aplikacji.

**Ważne:** to jeszcze nie gwarantuje, że strona zadziała — trzeba będzie sprawdzić, czy projekt poprawnie się buduje i czy ma ustawioną właściwą ścieżkę.

Napisz mi, gdy zapiszesz plik. 💙
